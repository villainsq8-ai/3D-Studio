<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png" />
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="3 Studio" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/global.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/shop.css" />

<body data-page="neon">
<div id="site-header"></div>

<main>
  <nav class="breadcrumbs container" id="breadcrumbs" aria-label="Breadcrumb"></nav>

  <section class="shop-hero neon-theme">
    <div class="container">
      <span class="kicker" style="color:var(--purple)">CUSTOM NEON</span>
      <h1>Make Your Space Glow.</h1>
      <p class="section-sub">Custom neon signs for homes, gaming rooms, offices, cafés, restaurants, booths, weddings and events.</p>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="chip-row" id="category-tabs"></div>
      <div class="shop-toolbar">
        <span class="result-count" id="result-count"></span>
        <select id="sort-select" aria-label="Sort products" style="width:auto;height:44px;">
          <option value="featured">Sort: Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
        </select>
      </div>

      <div class="product-grid" id="listing-grid"></div>

      <div class="bulk-banner" data-reveal>
        <div><h4>NEED 10+ UNITS?</h4><p>Bulk pricing available for cafés, offices, events and corporate gifts.</p></div>
        <a href="customize.html" class="btn btn-neon">REQUEST BULK PRICING</a>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/translations.js"></script>
<script src="js/products.js"></script>
<script src="js/favorites.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/app.js"></script>
<script>
  window.LISTING_TYPE = "neon";
  window.LISTING_CATEGORIES = [
    { slug: "all", label: "ALL" },
    { slug: "gaming", label: "GAMING" },
    { slug: "business-logos", label: "BUSINESS LOGOS" },
    { slug: "cafes-restaurants", label: "CAFÉS & RESTAURANTS" },
    { slug: "offices", label: "OFFICES" },
    { slug: "home-decor", label: "HOME DECOR" },
    { slug: "events", label: "EVENTS" },
    { slug: "booths", label: "BOOTHS" },
    { slug: "weddings", label: "WEDDINGS" },
    { slug: "custom-text", label: "CUSTOM TEXT" },
  ];
  document.addEventListener("DOMContentLoaded", () => {
    initBreadcrumbs([{ label: "Home", href: "index.html" }, { label: "Neon Lights", href: "neon.html" }]);
  });
</script>
<script src="js/shop-listing.js"></script>
</body>
