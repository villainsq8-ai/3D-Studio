<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Received | 3 Studio Kuwait</title>
<meta name="description" content="Your order has been received." />
<link rel="icon" href="assets/logo/logo.svg" type="image/svg+xml" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#07090C" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png" />
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="3 Studio" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/global.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
<style>
  .success-wrap { max-width: 520px; margin: 70px auto 100px; text-align: center; padding: 0 20px; }
  .success-ring { width: 96px; height: 96px; border-radius: 50%; background: rgba(40,199,111,0.12); border: 2px solid var(--success); display: flex; align-items: center; justify-content: center; margin: 0 auto 26px; font-size: 40px; color: var(--success); animation: successPop 600ms var(--ease); }
  @keyframes successPop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  .success-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; }
</style>
</head>
<body data-page="order-success">
<div id="site-header"></div>

<main>
  <div class="success-wrap">
    <div class="success-ring">✓</div>
    <h1 class="section-title">ORDER RECEIVED</h1>
    <p class="section-sub text-center">Thank you. Your order has been received and is being prepared.</p>
    <div class="order-id-tag" id="order-id-tag">ORD-2026-00000</div>
    <div class="success-actions">
      <a href="#" id="track-order-btn" class="btn btn-primary btn-lg btn-block">TRACK ORDER</a>
      <button id="whatsapp-order-btn" class="btn btn-outline btn-lg btn-block">SEND ORDER ON WHATSAPP</button>
      <a href="3d-prints.html" class="btn btn-ghost btn-lg btn-block">CONTINUE SHOPPING</a>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/translations.js"></script>
<script src="js/products.js"></script>
<script src="js/favorites.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const id = getParam("id");
    const order = id ? getOrderById(id) : null;
    if (!order) {
      qs(".success-wrap").innerHTML = `<div class="empty-state"><p class="empty-title">No order found</p><p class="empty-sub">This order confirmation link is invalid.</p><a href="index.html" class="btn btn-primary">Go Home</a></div>`;
      return;
    }
    qs("#order-id-tag").textContent = order.id;
    qs("#track-order-btn").href = `order.html?id=${order.id}`;
    qs("#whatsapp-order-btn").addEventListener("click", () => openWhatsApp(orderWhatsAppMessage(order)));
  });
</script>
</body>
</html>
